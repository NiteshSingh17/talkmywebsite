<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webchat — ChatGPT Sidebar</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        width: 100%;
        background: #0d0f17;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
      }

      /* ── Top bar ─────────────────────────────────────────── */
      #topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #0d1020;
        border-bottom: 1px solid #1e2330;
        flex-shrink: 0;
        min-height: 44px;
      }

      #logo {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        color: #fff;
        flex-shrink: 0;
      }

      #page-title {
        flex: 1;
        font-size: 12px;
        color: #94a3b8;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ef4444;
        flex-shrink: 0;
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
        transition: background 0.3s, box-shadow 0.3s;
      }

      #status-dot.online {
        background: #22c55e;
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
      }

      /* ── Loading overlay ─────────────────────────────────── */
      #loading {
        position: absolute;
        inset: 44px 0 0 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d0f17;
        z-index: 10;
        transition: opacity 0.3s;
      }

      #loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      #loading-text {
        font-size: 13px;
        color: #64748b;
      }

      /* ── ChatGPT iframe ──────────────────────────────────── */
      #chatgpt-frame {
        flex: 1;
        width: 100%;
        border: none;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="topbar">
        <div id="logo">W</div>
        <span id="page-title">Loading ChatGPT…</span>
        <span id="status-dot" title="API connection"></span>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <span id="loading-text">Opening ChatGPT…</span>
      </div>

      <iframe
        id="chatgpt-frame"
        src="about:blank"
        allow="clipboard-read; clipboard-write"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-storage-access-by-user-activation"
      ></iframe>
    </div>

    <script type="module" src="./index.ts"></script>
  </body>
</html>
